<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Project — Nikhil Sinha</title>
<link rel="stylesheet" href="assets/css/style.css">
<!-- Vendored, not CDN: the site has to keep working offline and after any CDN
     outage or version pull. Same pinned build, MIT licensed. -->
<script src="assets/vendor/plotly-2.35.2.min.js" charset="utf-8"></script>
</head>
<body>

<header class="site">
  <div class="inner">
    <div class="brand"><a href="index.html" style="color:inherit">Nikhil Sinha <span>· Data &amp; AI</span></a></div>
    <nav class="nav">
      <a href="index.html#projects">All projects</a>
      <a href="index.html#findings">Findings</a>
      <span class="status" id="apiStatus"><span class="dot"></span><span class="label">Static mode</span></span>
      <button class="icon-btn" id="themeBtn">☀️ Light</button>
    </nav>
  </div>
</header>

<div class="wrap">
  <a class="back" href="index.html">&larr; All projects</a>
  <div id="content"><p class="sub">Loading…</p></div>
</div>

<footer class="site"><div class="wrap"><div id="footmeta"></div></div></footer>

<script src="assets/js/app.js"></script>
<script>
function chartsHtml(p) {
  if (!p.charts.length) return "";
  return `<section><h2 class="sec">Measured results</h2>
    <p class="sub">Rendered directly from this project's report files.</p>
    <div class="chart-grid">
      ${p.charts.map((_, i) => `<div class="panel"><div class="chart" id="ch${i}"></div></div>`).join("")}
    </div></section>`;
}

/* Live demo panels only exist for projects that actually expose an API
   endpoint. Everything else stays static, rather than pretending. */
const LIVE_PANELS = {
  "12": `
    <section class="live-box">
      <h2 class="sec">Try it live</h2>
      <p class="sub">These call the running backend, which loads the real models this project trained.</p>

      <div class="panel">
        <strong>Ticket routing</strong>
        <p class="sub">Swap "me" and "you" and the class must flip — the metamorphic relation this
           project tests for.</p>
        <div class="io">
          <input id="tkText" value="the order was cancelled by me and not by you">
          <button class="btn" id="tkBtn">Classify</button>
        </div>
        <pre class="out" id="tkOut">—</pre>
      </div>

      <div class="panel">
        <strong>Pricing guardrails</strong>
        <p class="sub">Try an absurd multiplier or a 100% discount — the floor must hold.</p>
        <div class="io">
          <input id="prCost" type="number" value="24.5" step="0.5" placeholder="unit cost">
          <input id="prMult" type="number" value="2.1" step="0.1" placeholder="proposed multiplier">
          <input id="prDisc" type="number" value="5" step="5" placeholder="discount %">
          <button class="btn" id="prBtn">Price</button>
        </div>
        <pre class="out" id="prOut">—</pre>
      </div>

      <div class="panel">
        <strong>Supply-chain impact (graph traversal)</strong>
        <p class="sub">Which products break if this incident's component fails? No document states
           this — it is derived by walking the graph.</p>
        <div class="io">
          <select id="incSel">
            <option>INC-001</option><option>INC-002</option><option>INC-003</option>
            <option>INC-004</option><option>INC-005</option><option>INC-006</option>
            <option>INC-007</option><option>INC-008</option>
          </select>
          <button class="btn" id="incBtn">Trace impact</button>
        </div>
        <pre class="out" id="incOut">—</pre>
      </div>
    </section>
    <section class="live-only-note">
      <div class="panel"><div class="finding">
        <strong>Interactive demos are available.</strong> Start the backend
        (<code>python api/main.py</code>) and reload — this page will detect it and expose live
        model inference, the pricing guardrails and graph traversal.
      </div></div>
    </section>`,
};

function render(p, cat) {
  document.title = `${p.title} — Nikhil Sinha`;
  document.getElementById("content").innerHTML = `
    <section class="hero" style="padding-top:18px">
      <div class="num" style="color:var(--accent);font-weight:700;font-size:.76rem;letter-spacing:.09em">
        PROJECT ${esc(p.id)}
      </div>
      <h1 style="font-size:clamp(1.6rem,3.4vw,2.3rem)">${esc(p.title)}</h1>
      <p class="lede">${esc(p.pitch)}</p>
      <div class="tags">${p.roles.map(r => `<span class="tag role">${esc(r)}</span>`).join("")}</div>
    </section>

    ${p.headline_finding ? `<div class="panel"><div class="finding">
        <strong>Headline finding.</strong> ${esc(p.headline_finding)}</div></div>` : ""}

    <section>
      <h2 class="sec">Metrics</h2>
      <p class="sub">Each row is tagged with where the number came from.</p>
      <div class="panel">${metricsTable(p.metrics)}</div>
    </section>

    ${chartsHtml(p)}

    <section>
      <h2 class="sec">Topics &amp; stack</h2>
      <div class="panel">
        <p style="margin:0 0 8px"><strong>Topics</strong></p>
        <div class="tags">${p.topics.map(t => `<span class="tag">${esc(t)}</span>`).join("")}</div>
        <p style="margin:16px 0 8px"><strong>Stack</strong></p>
        <div class="tags">${p.stack.map(t => `<span class="tag">${esc(t)}</span>`).join("")}</div>
        <p class="sub" style="margin-top:16px">
          Source: <code>${esc(p.dir)}/</code> — ${p.n_report_files} report file(s),
          ${p.screenshots.length} preview image(s).
        </p>
      </div>
    </section>

    ${LIVE_PANELS[p.id] || ""}
  `;

  p.charts.forEach((spec, i) => renderChart(document.getElementById(`ch${i}`), spec));
  if (LIVE_PANELS[p.id]) wireLive();
}

async function callApi(path, opts) {
  if (!state.apiBase) return { error: "API not connected" };
  try {
    const r = await fetch(state.apiBase + path, opts);
    return await r.json();
  } catch (e) {
    return { error: String(e) };
  }
}

function wireLive() {
  const tk = document.getElementById("tkBtn");
  if (tk) tk.addEventListener("click", async () => {
    const out = document.getElementById("tkOut");
    out.textContent = "…";
    const r = await callApi("/api/live/classify", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ text: document.getElementById("tkText").value }),
    });
    out.textContent = JSON.stringify(r, null, 2);
  });

  const pr = document.getElementById("prBtn");
  if (pr) pr.addEventListener("click", async () => {
    const out = document.getElementById("prOut");
    out.textContent = "…";
    const r = await callApi("/api/live/price", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        product_id: "PRD001",
        unit_cost: parseFloat(document.getElementById("prCost").value),
        proposed_multiplier: parseFloat(document.getElementById("prMult").value),
        discount_pct: parseFloat(document.getElementById("prDisc").value),
      }),
    });
    out.textContent = JSON.stringify(r, null, 2);
  });

  const inc = document.getElementById("incBtn");
  if (inc) inc.addEventListener("click", async () => {
    const out = document.getElementById("incOut");
    out.textContent = "…";
    const r = await callApi(`/api/live/impact/${document.getElementById("incSel").value}`);
    out.textContent = JSON.stringify(r, null, 2);
  });
}

(async function () {
  initTheme();
  const cat = await loadCatalog();
  const id = new URLSearchParams(location.search).get("id");
  const p = cat.projects.find(x => x.id === id) || cat.projects[0];
  render(p, cat);
  document.getElementById("footmeta").textContent =
    `Catalog generated ${cat.generated_at} · built by ${cat.owner}`;
  await probeApi();
})();
</script>
</body>
</html>
